[project]
name = "ragifix-mcp"
version = "0.1.0"
description = "Serveur MCP (Model Context Protocol) exposant une base ragifix à un client de chat compatible."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=2.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.scripts]
ragifix-mcp = "ragifix_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragifix_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/ragifix_mcp", "pyproject.toml", "README.md"]
